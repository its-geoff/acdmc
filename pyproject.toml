[project]
name = "acdmc"
version = "0.1"
description = "Your personal academic sidekick — track assignments, estimate grades, and organize your class schedule."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
